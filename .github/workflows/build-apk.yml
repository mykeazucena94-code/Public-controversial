
name: Build Screen AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed
- name: Check project files
    shell: bash
    run: |
      echo "=== Repository root ==="
      pwd
      ls -la

      failed=0

      if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
        echo "OK: Gradle settings file found"
      else
        echo "ERROR: Missing settings.gradle.kts or settings.gradle"
        failed=1
      fi

      if [ -f gradlew ]; then
        echo "OK: gradlew found"
      else
        echo "ERROR: gradlew is missing"
        failed=1
      fi

      if [ -d app ]; then
        echo "OK: app/ folder found"
      else
        echo "ERROR: app/ folder is missing"
        failed=1
      fi

      if [ "$failed" -ne 0 ]; then
        echo "=== Top-level files and folders ==="
        find . -maxdepth 3 -type f | sort | head -200
        exit 1
      fi

      echo "All required project files found."


      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Screen AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Screen-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
